  <div class="app-container" id="mainApp">
    
    <!-- PROMO BANNER -->
    <div class="promo-banner">
      <div>
        <h3>20% की विशेष छूट! 🎉</h3>
        <p>स्वादिष्ट शुद्ध शाकाहारी भोजन आपके द्वार पर</p>
      </div>
      <i class="fa-solid fa-bowl-food" style="font-size: 32px; opacity:0.8;"></i>
    </div>

    <!-- ADMIN PANEL -->
    <div class="admin-panel" id="adminPanel">
      <div class="admin-title"><i class="fa-solid fa-user-shield"></i> एडमिन कंट्रोल (नया आइटम जोड़ें)</div>
      <input type="text" class="input-box" id="itemName" placeholder="व्यंजन का नाम (उदा: कड़ाई पनीर)" style="margin-bottom:8px;">
      <input type="number" class="input-box" id="itemPrice" placeholder="कीमत (₹)" style="margin-bottom:8px;">
      <select class="input-box" id="itemCat" style="margin-bottom:8px;">
        <option value="paneer">पनीर स्पेशल</option>
        <option value="roti">रोटी / ब्रेड</option>
        <option value="drinks">ड्रिंक्स & स्वीट्स</option>
      </select>
      <button class="btn-submit" style="background:#f57c00; box-shadow:none;" onclick="addMenuItem()">+ मेनू में सेव करें</button>
      <div style="margin-top:15px; font-weight:800; font-size:13px;">लाइव ऑर्डर्स:</div>
      <div id="liveOrders"></div>
    </div>

    <!-- SEARCH BAR -->
    <div class="search-box-wrapper">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" class="search-input" id="searchInput" placeholder="पसंदीदा व्यंजन खोजें..." onkeyup="filterMenu()">
    </div>

    <!-- CATEGORIES -->
    <div class="categories">
      <button class="cat-btn active" onclick="filterCat('all', this)">सब (All)</button>
      <button class="cat-btn" onclick="filterCat('paneer', this)">पनीर स्पेशल</button>
      <button class="cat-btn" onclick="filterCat('roti', this)">रोटी / ब्रेड</button>
      <button class="cat-btn" onclick="filterCat('drinks', this)">ड्रिंक्स & स्वीट्स</button>
    </div>

    <!-- FOOD MENU LIST -->
    <div id="menuList"></div>
  </div>

  <!-- FLOATING CART BAR -->
  <div class="cart-bar" id="cartBar">
    <div>
      <div style="font-size: 11px; color: #777; font-weight:600;">कुल राशि (<span id="cartCount">0</span> आइटम्स)</div>
      <div style="font-size: 19px; font-weight: 800; color: #111;">₹<span id="totalPrice">0</span></div>
    </div>
    <button class="cart-btn" onclick="sendOrder()">
      <i class="fa-brands fa-whatsapp"></i> WhatsApp ऑर्डर
    </button>
  </div>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAJ6RfuOQWw3XV_5E_JLcOCuMzldCMSM-E",
      authDomain: "shreemalook-restaurant.firebaseapp.com",
      projectId: "shreemalook-restaurant",
      databaseURL: "https://shreemalook-restaurant-default-rtdb.firebaseio.com",
      storageBucket: "shreemalook-restaurant.appspot.com",
      messagingSenderId: "666247853776",
      appId: "1:666247853776:web:ab837e82da6327347e90d5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const ADMIN_EMAIL = "surajchardana@gmail.com";
    const ADMIN_PASS = "shreemalook2026";
    let currentUser = "", userLocation = "लोकेशन प्राप्त नहीं हुई";
    let allMenuItems = [], cart = {};

    // Premium Default Items
    const defaultMenu = [
      { id: "d1", name: "शाही पनीर", price: 220, category: "paneer", desc: "ताज़ा पनीर और रिच क्रीमी ग्रेवी", img: "https://images.unsplash.com/photo-1631452180519-c014fe946bc7?w=300" },
      { id: "d2", name: "दाल मखनी", price: 180, category: "paneer", desc: "मक्खन और मलाई से भरपूर खास दाल", img: "https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=300" },
      { id: "d3", name: "तंदूरी बटर रोटी", price: 25, category: "roti", desc: "गरमा गरम तंदूरी मक्खन रोटी", img: "https://images.unsplash.com/photo-1626074353765-517a681e40be?w=300" },
      { id: "d4", name: "ठंडी लस्सी", price: 60, category: "drinks", desc: "मलाईदार मीठी पंजाबी लस्सी", img: "https://images.unsplash.com/photo-1571006682885-23c3453a29bc?w=300" }
    ];

    window.onload = function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => { userLocation = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`; },
          (err) => { userLocation = "लोकेशन एक्सेस नहीं मिला"; }
        );
      }
    };

    function handleLogin() {
      const e = document.getElementById('email').value.trim();
      const p = document.getElementById('password').value.trim();
      if (!e || !p) return alert("कृपया ईमेल और पासवर्ड दोनों भरें!");

      currentUser = e;
      document.getElementById('authBox').style.display = 'none';
      document.getElementById('logoutBtn').style.display = 'block';
      document.getElementById('mainApp').style.display = 'block';

      if (e === ADMIN_EMAIL && p === ADMIN_PASS) {
        document.getElementById('adminPanel').style.display = 'block';
      } else {
        document.getElementById('cartBar').style.display = 'flex';
      }
      loadMenuData();
    }

    function loadMenuData() {
      db.ref('menu/').on('value', snapshot => {
        allMenuItems = [];
        if (snapshot.exists()) {
          snapshot.forEach(child => {
            allMenuItems.push({ id: child.key, ...child.val() });
          });
        } else {
          allMenuItems = defaultMenu;
        }
        renderMenu(allMenuItems);
      }, err => { renderMenu(defaultMenu); });
    }

    function renderMenu(items) {
      const list = document.getElementById('menuList');
      list.innerHTML = '';
      
      if(items.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding:30px; color:#777;">कोई व्यंजन नहीं मिला!</div>`;
        return;
      }

      items.forEach(item => {
        const qty = cart[item.id] ? cart[item.id].qty : 0;
        const imgUrl = item.img || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300";

        let actionHtml = `<button class="add-btn" onclick="updateQty('${item.id}', 1, '${item.name}', ${item.price})">ADD</button>`;
        if(qty > 0) {
          actionHtml = `
            <div class="qty-control">
              <button class="qty-btn" onclick="updateQty('${item.id}', -1, '${item.name}', ${item.price})">-</button>
              <span>${qty}</span>
              <button class="qty-btn" onclick="updateQty('${item.id}', 1, '${item.name}', ${item.price})">+</button>
            </div>`;
        }

        list.innerHTML += `
          <div class="food-card">
            <div class="food-info">
              <div class="food-title"><span class="veg-symbol">🟢</span> ${item.name}</div>
              <div class="food-price">₹${item.price}</div>
              <div class="food-desc">${item.desc || "ताजा और स्वादिष्ट"}</div>
            </div>
            <div class="food-action">
              <img src="${imgUrl}" class="food-img">
              ${actionHtml}
            </div>
          </div>`;
      });
    }

    function updateQty(id, change, name, price) {
      if(!cart[id]) cart[id] = { name, price, qty: 0 };
      cart[id].qty += change;

      if(cart[id].qty <= 0) delete cart[id];
      
      updateCartTotals();
      renderMenu(allMenuItems);
    }

    function updateCartTotals() {
      let total = 0, count = 0;
      for (let id in cart) {
        total += cart[id].price * cart[id].qty;
        count += cart[id].qty;
      }
      document.getElementById('totalPrice').innerText = total;
      document.getElementById('cartCount').innerText = count;
    }

    function filterCat(category, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if(category === 'all') {
        renderMenu(allMenuItems);
      } else {
        const filtered = allMenuItems.filter(i => i.category === category);
        renderMenu(filtered);
      }
    }

    function filterMenu() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allMenuItems.filter(i => i.name.toLowerCase().includes(q));
      renderMenu(filtered);
    }

    function addMenuItem() {
      const name = document.getElementById('itemName').value;
      const price = document.getElementById('itemPrice').value;
      const category = document.getElementById('itemCat').value;
      if (!name || !price) return alert("नाम और कीमत दोनों भरें!");

      db.ref('menu/').push({ 
        name, price: Number(price), category,
        desc: "स्वादिष्ट व्यंजन", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300"
      });

      alert("व्यंजन मेनू में जोड़ दिया गया!");
      document.getElementById('itemName').value = '';
      document.getElementById('itemPrice').value = '';
    }

    function sendOrder() {
      let keys = Object.keys(cart);
      if (keys.length === 0) return alert("कार्ट में कुछ जोड़ें!");

      let total = 0;
      let msg = `*श्रीमालूक रेस्टोरेंट - नया ऑर्डर*%0A`;
      msg += `ग्राहक: ${currentUser}%0A%0A*आइटम लिस्ट:*%0A`;
      
      keys.forEach((id, i) => {
        let item = cart[id];
        let itemTotal = item.price * item.qty;
        total += itemTotal;
        msg += `${i + 1}. ${item.name} x ${item.qty} = ₹${itemTotal}%0A`;
      });

      msg += `%0A*कुल योग:* ₹${total}%0A*लोकेशन:* ${userLocation}`;

      db.ref('orders/').push({ user: currentUser, total, location: userLocation, time: Date.now() });
      window.open(`https://wa.me/917339761118?text=${msg}`, '_blank');
    }

    db.ref('orders/').on('child_added', snapshot => {
      const data = snapshot.val();
      const div = document.createElement('div');
      div.className = 'order-badge';
      div.innerHTML = `<strong>नया ऑर्डर:</strong> ₹${data.total} (${data.user})`;
      document.getElementById('liveOrders').prepend(div);
    });
  </script>
</body>
</html>
